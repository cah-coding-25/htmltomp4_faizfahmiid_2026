<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="render-duration" content="12"><meta name="render-orientation" content="portrait">
<title>Demo Portrait Audio</title>
<style>
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;color:white;font-family:Arial;background:linear-gradient(145deg,#111827,#312e81,#7c3aed)}
main{text-align:center;padding:8vw;animation:up 2s ease-in-out infinite alternate}h1{font-size:clamp(42px,9vw,100px);line-height:1.05}.orb{width:22vw;height:22vw;max-width:180px;max-height:180px;border-radius:50%;margin:auto;background:radial-gradient(circle at 30% 25%,white,#67e8f9 35%,#6366f1 75%);box-shadow:0 0 65px #67e8f9;animation:pulse 1.4s infinite alternate}
@keyframes up{to{transform:translateY(-24px)}}@keyframes pulse{to{transform:scale(1.18)}}
</style></head>
<body><main><div class="orb"></div><h1>HELLO<br>MP4</h1><p>Portrait + audio test</p></main>
<script>
addEventListener("load",async()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.04;o.connect(g).connect(c.destination);await c.resume();o.start();o.stop(c.currentTime+1.5)}catch(e){console.warn(e)}});
</script></body></html>
