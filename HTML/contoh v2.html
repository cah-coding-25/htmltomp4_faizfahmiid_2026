<!DOCTYPE html>
<html lang="id" data-render-duration="60">
<head>
    <meta charset="UTF-8">
    <meta name="render-duration" content="60">
    <title>Test Render 60 Detik</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 48px;
            animation: move 60s linear forwards;
        }

        @keyframes move {
            0% {
                transform: translateX(-200px);
                opacity: 0;
            }

            100% {
                transform: translateX(200px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <h1>HTML TO MP4 ENGINE</h1>
</body>
</html>
