name: Faiz Fahmi ID - Android Web To App Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique Build ID (e.g. FAIZ-20261012-XXXX)'
        required: true
        default: 'FAIZ-BUILD-DEMO'
      web_url:
        description: 'Website URL to wrap'
        required: true
        default: 'https://example.com'
      app_title:
        description: 'Application Title'
        required: true
        default: 'Faiz App'
      package_name:
        description: 'Android Package Name'
        required: false
        default: 'com.faizfahmiid.myapp'
      build_type:
        description: 'Build Type (apk, aab, both)'
        required: false
        default: 'apk'
      show_url_bar:
        description: 'Show URL address bar (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3584m -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK Licenses & Environment
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a2b8e3f8a7b8e9f48b3d636b0db\n79124472a0a5b3c788b604e108e09f61a783151b\n859f317696f67ef43be2a99d169bb107778044ee\nbfb3546ed2464ba917c86a3388b73607b8142b6b" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "84831b9409646a2b8e3f8a7b8e9f48b3d636b0db\n859f317696f67ef43be2a99d169bb107778044ee" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo -e "601085b94cd77f0b54ff86406957099fed8072f0" > "$ANDROID_HOME/licenses/android-googletv-license" || true
          echo -e "33b6a2b64607f11b759f320e80179f33f61b5219" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Keystore & Environment Secrets
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew || true

      - name: Build Android APK
        run: |
          echo "Starting Gradle Build for Build ID: ${{ github.event.inputs.build_id }}..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect Output Artifacts
        run: |
          mkdir -p output_artifacts
          find app/build/outputs/apk/ -name "*.apk" -type f | while read file; do
            echo "Found APK: $file"
            cp "$file" "output_artifacts/${{ github.event.inputs.build_id }}.apk"
            cp "$file" "output_artifacts/Webtoapp.apk"
          done
          ls -la output_artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ github.event.inputs.build_id }}
          path: output_artifacts/*.apk
          retention-days: 30

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew bundleDebug --stacktrace --no-daemon || true
          find app/build/outputs/bundle/ -name "*.aab" -type f | while read file; do
            echo "Found AAB: $file"
            cp "$file" "output_artifacts/${{ github.event.inputs.build_id }}.aab"
          done

      - name: Upload AAB Artifact
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ github.event.inputs.build_id }}
          path: output_artifacts/*.aab
          retention-days: 30

      - name: Create GitHub Release for Direct APK Download
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-${{ github.event.inputs.build_id }}"
          TITLE="${{ github.event.inputs.app_title }} (Build ${{ github.event.inputs.build_id }})"
          gh release create "$TAG_NAME" output_artifacts/*.apk \
            --title "$TITLE" \
            --notes "Otomatis dibuat oleh Faiz Fahmi ID - Web to App Builder untuk ${{ github.event.inputs.web_url }}" || true
