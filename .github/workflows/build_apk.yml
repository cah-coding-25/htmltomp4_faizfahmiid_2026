name: Faiz Fahmi ID - Android Web To App Builder

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique Build ID (e.g. FAIZ-20261004-XXXX)'
        required: true
        default: 'FAIZ-BUILD-DEMO'
      web_url:
        description: 'Website URL to wrap'
        required: true
        default: 'https://example.com'
      app_title:
        description: 'Application Title'
        required: true
        default: 'Faiz App'
      package_name:
        description: 'Android Package Name'
        required: false
        default: 'com.faizfahmiid.myapp'
      build_type:
        description: 'Build Type (apk, aab, both)'
        required: false
        default: 'apk'
      show_url_bar:
        description: 'Show URL address bar (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          echo "Starting Gradle Build for ${{ github.event.inputs.build_id }}..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename Output APK
        run: |
          mkdir -p output_artifacts
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_artifacts/${{ github.event.inputs.build_id }}.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ github.event.inputs.build_id }}
          path: output_artifacts/*.apk
          retention-days: 14

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew bundleDebug --stacktrace --no-daemon || true
          find app/build/outputs/bundle/ -name "*.aab" -exec cp {} output_artifacts/${{ github.event.inputs.build_id }}.aab \; || true

      - name: Upload AAB Artifact
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ github.event.inputs.build_id }}
          path: output_artifacts/*.aab
          retention-days: 14
